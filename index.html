<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>آیا منو دوستم داره؟</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#03060b;--ink:#ffffff;--rose:#e8527a;--soft:#c98aa0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit}
html,body{height:100%;margin:0}
body{font-family:"Vazirmatn",Tahoma,sans-serif;color:var(--ink);color-scheme:dark;background:radial-gradient(90% 70% at 50% 55%,#0a0f18,var(--bg));overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%}
.say{font-size:clamp(30px,8vw,52px);font-weight:800;margin:0;min-height:1.3em;text-align:center;color:var(--rose)}
.say.pop{animation:pop .4s cubic-bezier(.2,1.5,.4,1)}
.say.no{color:#fff}
.say.yes{color:var(--rose)}
@keyframes pop{0%{transform:translateY(8px);opacity:0}100%{transform:none;opacity:1}}
.stage{background:none;border:0;padding:0;cursor:pointer;width:min(94vw,440px,calc((100vh - 200px)*.8));aspect-ratio:.8;-webkit-tap-highlight-color:transparent}
.stage:focus-visible{outline:2px solid var(--soft);outline-offset:6px;border-radius:20px}
.stage canvas{width:100%;height:100%;display:block}
.again{font-family:inherit;font-weight:800;font-size:15px;color:#fff;background:#c2214f;border:0;border-radius:999px;padding:9px 26px;cursor:pointer;visibility:hidden}
.again.show{visibility:visible}
</style>
</head>
<body>
<p class="say" id="say" aria-live="polite">دوستم داره؟</p>
<button class="stage" id="stage" aria-label="یه گلبرگ بکن"></button>
<button class="again" id="again">دوباره امتحان کن</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
var say=document.getElementById("say"),again=document.getElementById("again"),stage=document.getElementById("stage");
var calm=window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches;
var AC=window.AudioContext||window.webkitAudioContext,actx=null;
function snd(){
  try{
    if(!AC)return;
    if(!actx)actx=new AC();
    if(actx.state==="suspended")actx.resume();
    var sr=actx.sampleRate,t=actx.currentTime;
    /* fibrous tear: noise with crackly, uneven amplitude */
    var len=Math.floor(sr*(.14+Math.random()*.06)),buf=actx.createBuffer(1,len,sr),d=buf.getChannelData(0);
    var gain=1,hold=0;
    for(var k=0;k<len;k++){
      if(--hold<=0){gain=Math.random()<.35?.08:.35+Math.random()*.65;hold=20+Math.floor(Math.random()*110);}
      var env=Math.pow(1-k/len,1.4)*Math.min(1,k/(sr*.004));
      d[k]=(Math.random()*2-1)*gain*env;
    }
    var src=actx.createBufferSource();src.buffer=buf;
    var hp=actx.createBiquadFilter();hp.type="highpass";hp.frequency.value=1400;
    var bp=actx.createBiquadFilter();bp.type="bandpass";bp.Q.value=.7;
    bp.frequency.setValueAtTime(4200,t);bp.frequency.exponentialRampToValueAtTime(2200,t+.15);
    var g=actx.createGain();g.gain.value=.55;
    src.connect(hp);hp.connect(bp);bp.connect(g);g.connect(actx.destination);src.start(t);
    /* tiny snap where the petal lets go of the stem */
    var sl=Math.floor(sr*.025),sb=actx.createBuffer(1,sl,sr),sd=sb.getChannelData(0);
    for(var j=0;j<sl;j++){sd[j]=(Math.random()*2-1)*Math.pow(1-j/sl,3);}
    var ss=actx.createBufferSource();ss.buffer=sb;
    var sf=actx.createBiquadFilter();sf.type="bandpass";sf.frequency.value=1800;sf.Q.value=.9;
    var sg=actx.createGain();sg.gain.value=.7;
    ss.connect(sf);sf.connect(sg);sg.connect(actx.destination);ss.start(t);
  }catch(e){}
}
var renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
stage.appendChild(renderer.domElement);
var scene=new THREE.Scene();
var camera=new THREE.PerspectiveCamera(34,.8,.1,60);
camera.position.set(0,4.4,8.6);camera.lookAt(0,-.2,0);
function resize(){var w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
window.addEventListener("resize",resize);resize();

var flower=new THREE.Group();scene.add(flower);
var bloom=new THREE.Group();flower.add(bloom);
var CRIM=0xd8244f;

/* faint floor grid + stem */
var gp=[];for(var i=-4;i<=4;i++){gp.push(i,-3,-4,i,-3,4,-4,-3,i,4,-3,i);}
var gg=new THREE.BufferGeometry();gg.setAttribute("position",new THREE.Float32BufferAttribute(gp,3));
flower.add(new THREE.LineSegments(gg,new THREE.LineBasicMaterial({color:0x2a3b4a,transparent:true,opacity:.18})));
var sc=new THREE.CatmullRomCurve3([new THREE.Vector3(0,0,0),new THREE.Vector3(.1,-1,0),new THREE.Vector3(-.08,-2,0),new THREE.Vector3(0,-3,0)]);
flower.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(sc.getPoints(30)),new THREE.LineBasicMaterial({color:0x2f8f5a,transparent:true,opacity:.7})));

/* petals */
var N=11,SU=18,SV=24;
function lerp(a,b,t){return a+(b-a)*t}
function disposeObj(o){o.traverse(function(c){if(c.geometry)c.geometry.dispose();if(c.material)c.material.dispose();});}
function petal(i){
  var tt=i/(N-1);
  var alpha=lerp(1.22,.14,Math.pow(tt,.8)),L=lerp(1.45,.85,tt),beta=lerp(.93,.8,tt),phi=i*2.39996,y0=tt*.12;
  var pos=[];
  for(var a=0;a<=SU;a++){var u=a/SU;
    var wf=Math.pow(Math.sin(Math.PI*(.1+.8*u)),.35);
    var al=alpha*(.25+.75*u)+.5*Math.pow(u,5)*(.4+tt*.3);
    var r=L*u*Math.sin(al),y=y0+L*u*Math.cos(al)*(1-.25*(1-tt)*u)-(1-tt)*.35*u*u;
    for(var b=0;b<=SV;b++){var v=b/SV*2-1,th=phi+v*beta*wf*(1+.0*u);
      var rr=r*(1+.06*Math.sin(v*6)*u);
      pos.push(rr*Math.sin(th),y+.05*v*v*u,rr*Math.cos(th));}}
  var seg=[];
  for(var a=0;a<=SU;a++)for(var b=0;b<SV;b++){var p=(a*(SV+1)+b)*3,q=p+3;seg.push(pos[p],pos[p+1],pos[p+2],pos[q],pos[q+1],pos[q+2]);}
  for(var a=0;a<SU;a++)for(var b=0;b<=SV;b++){var p=(a*(SV+1)+b)*3,q=((a+1)*(SV+1)+b)*3;seg.push(pos[p],pos[p+1],pos[p+2],pos[q],pos[q+1],pos[q+2]);}
  var idx=[];for(var a=0;a<SU;a++)for(var b=0;b<SV;b++){var k=a*(SV+1)+b,m=k+SV+1;idx.push(k,m,k+1,m,m+1,k+1);}
  var fg=new THREE.BufferGeometry();fg.setAttribute("position",new THREE.Float32BufferAttribute(pos,3));fg.setIndex(idx);
  var lg=new THREE.BufferGeometry();lg.setAttribute("position",new THREE.Float32BufferAttribute(seg,3));
  var fill=new THREE.Mesh(fg,new THREE.MeshBasicMaterial({color:0x14030a,transparent:true,opacity:.78,side:THREE.DoubleSide,polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1}));
  var lines=new THREE.LineSegments(lg,new THREE.LineBasicMaterial({color:CRIM,transparent:true,opacity:.9,blending:THREE.AdditiveBlending,depthWrite:false}));
  var g=new THREE.Group();g.add(fill,lines);g.userData={fill:fill,lines:lines};return g;
}

/* wire heart */
function makeHeart(){
  var s=new THREE.Shape();
  s.moveTo(0,.35);s.bezierCurveTo(0,.8,-.9,.9,-.9,.25);s.bezierCurveTo(-.9,-.3,-.2,-.6,0,-.95);
  s.bezierCurveTo(.2,-.6,.9,-.3,.9,.25);s.bezierCurveTo(.9,.9,0,.8,0,.35);
  var g=new THREE.ExtrudeGeometry(s,{depth:.3,bevelEnabled:true,bevelThickness:.14,bevelSize:.11,bevelSegments:4,curveSegments:16});g.center();
  var h=new THREE.Group();
  h.add(new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:0x3a0614,polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1})));
  h.add(new THREE.LineSegments(new THREE.WireframeGeometry(g),new THREE.LineBasicMaterial({color:0xff4d7d,transparent:true,opacity:.85,blending:THREE.AdditiveBlending,depthWrite:false})));
  return h;
}

/* state */
var petals=[],falling=[],cur=0,round=0,busy=false,heart=null,heartT=0,now=0,pulled=0;
function ease(t){var c=1.70158;t=Math.min(1,Math.max(0,t));return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)}
function setSay(t,cls){say.textContent=t;say.className="say pop "+(cls||"");}

function build(){
  petals.forEach(function(p){if(p){bloom.remove(p);disposeObj(p);}});petals=[];
  falling.forEach(function(p){if(p.parent)p.parent.remove(p);disposeObj(p);});falling=[];
  if(heart){scene.remove(heart);disposeObj(heart);heart=null}
  /* inner petals first so the bloom grows from the center */
  for(var i=0;i<N;i++){var p=petal(i);p.userData.birth=now+(N-1-i)*.1;p.scale.setScalar(.001);bloom.add(p);petals[i]=p;}
  cur=0;pulled=0;
}

function pull(){
  if(busy||cur>=N)return;
  busy=true;
  var i=cur++,p=petals[i],isLast=(cur===N);
  snd();
  var loves=(round===0)?(pulled%2===1):(pulled%2===0);
  pulled++;
  var wq=new THREE.Quaternion();p.getWorldQuaternion(wq);
  if(isLast&&round===1){
    p.userData.vanish=0;falling.push(p);petals[i]=null;busy=true;
    heart=makeHeart();heart.position.set(0,.55,0);heart.scale.setScalar(.001);heartT=0;scene.add(heart);
    setSay("دوستم داره.","yes");again.classList.add("show");stage.disabled=true;busy=false;return;
  }
  scene.attach(p);petals[i]=null;
  var ang=Math.random()*6.28;
  p.userData.vel=new THREE.Vector3(Math.cos(ang)*1.4,2.2+Math.random()*.8,Math.sin(ang)*1.4);
  p.userData.spin=new THREE.Vector3(Math.random()*2-1,Math.random()*3-1.5,Math.random()*2-1);
  p.userData.t=0;falling.push(p);
  setSay(loves?"دوستم داره.":"دوستم نداره.",loves?"yes":"no");
  setTimeout(function(){busy=false;if(isLast&&round===0)endFirst();},isLast&&round===0?900:380);
}

function endFirst(){
  busy=true;
  setTimeout(function(){
    setSay("حتماً اشتباه شمردم.","yes");
    setTimeout(function(){round=1;build();setTimeout(function(){busy=false;},1200);},1900);
  },900);
}
function reset(){round=0;stage.disabled=false;again.classList.remove("show");setSay("دوستم داره؟","yes");build();}
stage.addEventListener("click",pull);
again.addEventListener("click",reset);

var last=performance.now();
function loop(t){
  requestAnimationFrame(loop);
  var dt=Math.min(.05,(t-last)/1000);last=t;now+=dt;
  if(!calm){flower.rotation.y=now*.3;flower.rotation.z=Math.sin(now*.7)*.03;}
  petals.forEach(function(p){if(!p)return;var k=(now-p.userData.birth)/.9;p.scale.setScalar(k<1?Math.max(.001,ease(k)):1);});
  for(var i=falling.length-1;i>=0;i--){
    var p=falling[i],u=p.userData;
    if(u.vanish!==undefined){u.vanish+=dt;var s=Math.max(.001,1-u.vanish*2.4);p.scale.setScalar(s);if(s<=.002){bloom.remove(p);disposeObj(p);falling.splice(i,1);}continue;}
    u.t+=dt;u.vel.y-=.9*dt;u.vel.multiplyScalar(1-.6*dt);p.position.addScaledVector(u.vel,dt);
    p.rotation.x+=u.spin.x*dt;p.rotation.y+=u.spin.y*dt;p.rotation.z+=u.spin.z*dt;
    var f=Math.max(0,1-u.t/1.7);
    u.lines.material.opacity=.9*f;u.fill.material.opacity=.78*f;
    p.scale.setScalar(1+u.t*.25);
    if(f<=0){scene.remove(p);disposeObj(p);falling.splice(i,1);}
  }
  if(heart){heartT+=dt;var e=ease(heartT/1.1),b=heartT>1.1?1+.08*Math.sin((heartT-1.1)*7):1;heart.scale.setScalar(Math.max(.001,.95*e*b));heart.position.y=.55+.5*Math.min(1,heartT/1.1);heart.rotation.y=Math.sin(now*1.2)*.6;}
  renderer.render(scene,camera);
}
build();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
